name: Build downloadable Linux CLI

on:
  push:
    branches: [async-main]
    paths:
      - '.github/workflows/async-linux-release.yml'
      - 'scripts/async_fork/package.sh'
      - 'scripts/async_fork/install-package.sh'
      - 'codex-rs/**'
      - 'scripts/codex_package/**'
      - 'third_party/v8/**'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
  workflow_run:
    workflows: ['Async fork upstream sync']
    types: [completed]
    branches: [async-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: async-linux-release
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: async-main
          persist-credentials: false
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          TAG="async-${SHA:0:12}"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName > "$RUNNER_TEMP/releases.json"
          python3 - "$SHA" "$TAG" "$RUNNER_TEMP/releases.json" <<'PY'
          import json, os, sys
          found = any(item['tagName'] == sys.argv[2] for item in json.load(open(sys.argv[3])))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sys.argv[1]}\ntag={sys.argv[2]}\nbuild={str(not found).lower()}\n')
          PY

  package:
    needs: source
    if: needs.source.outputs.build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      ASYNC_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Reuse the package from successful upstream validation
        id: reuse
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: async-linux-release-package
          path: ${{ runner.temp }}/async-package
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.reuse.outcome != 'success'
        with:
          python-version: '3.12'
      - name: Prepare native dependencies
        if: steps.reuse.outcome != 'success'
        timeout-minutes: 5
        run: |
          python3 scripts/async_fork/native_deps.py --prefix "$RUNNER_TEMP/async-native" --env-file "$RUNNER_TEMP/async-native.env"
          cat "$RUNNER_TEMP/async-native.env" >> "$GITHUB_ENV"
      - name: Build and check the installable package
        if: steps.reuse.outcome != 'success'
        run: |
          set -o pipefail
          CORES=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
          nice -n 15 taskset -c "$CORES" bash scripts/async_fork/package.sh 2>&1 | tee "$RUNNER_TEMP/package-build.log"
      - name: Verify package identity and checksum
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          cd "$RUNNER_TEMP/async-package"
          sha256sum --check SHA256SUMS
          python3 -c 'import json, os; assert json.load(open("BUILD_INFO.json"))["source_commit"] == os.environ["SOURCE_SHA"]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: downloadable-linux-cli
          path: ${{ runner.temp }}/async-package/
          retention-days: 7
      - name: Retain build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-package-build-log
          path: ${{ runner.temp }}/package-build.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [source, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: downloadable-linux-cli
          path: dist
      - name: Publish the finished package
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Linux x86_64 preview built from $SOURCE_SHA.

          Download codex-async-linux-x86_64.tar.gz, unpack the complete archive, run bash ./install.sh, then ~/.local/bin/codex-async.

          Includes CLI, Code Mode host, execution server, ripgrep, sandbox, installer and checksums. No root access is needed; the official codex command is preserved.

          Requires glibc 2.35+ (Ubuntu 22.04+, Debian 12+) and system libssl3/libcap2. Built with dev-small: full functionality without release optimization. The binary banner is upstream 0.0.0; VERSION and BUILD_INFO.json identify the fork build.
          EOF
          gh release create "$RELEASE_TAG" dist/codex-async-linux-x86_64.tar.gz dist/SHA256SUMS dist/BUILD_INFO.json dist/INSTALL.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Codex Async Linux x86_64 ($RELEASE_TAG)" --prerelease --notes-file "$RUNNER_TEMP/notes.md"
