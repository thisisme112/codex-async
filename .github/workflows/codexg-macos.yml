name: Build codexg for Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [background-completion-wake]
    paths:
      - .github/workflows/codexg-macos.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
      TARGET: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin
      - name: Build CLI and companion binaries
        working-directory: codex-rs
        run: |
          set -euo pipefail
          export STABLE_GIT_COMMIT="$GITHUB_SHA"
          cargo build --locked --release --target "$TARGET" \
            --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy
      - name: Package and verify
        run: |
          set -euo pipefail
          package="codexg-${TARGET}"
          mkdir -p "dist/${package}/bin"
          for binary in codex codex-code-mode-host codex-responses-api-proxy; do
            path="dist/${package}/bin/${binary}"
            cp "codex-rs/target/${TARGET}/release/${binary}" "$path"
            strip -x "$path"
            entitlements=".github/scripts/macos-signing/${binary}.entitlements.plist"
            if [[ -f "$entitlements" ]]; then
              codesign --force --sign - --entitlements "$entitlements" "$path"
            else
              codesign --force --sign - "$path"
            fi
            codesign --verify --strict "$path"
            lipo "$path" -verify_arch arm64
            otool -L "$path"
            if otool -L "$path" | grep -E '/opt/homebrew/|/usr/local/'; then
              echo "Unexpected dependency on locally installed libraries" >&2
              exit 1
            fi
          done
          ln -s codex "dist/${package}/bin/codexg"
          "dist/${package}/bin/codexg" --version
          "dist/${package}/bin/codex-code-mode-host" --help
          printf '%s\n' "$GITHUB_SHA" > "dist/${package}/COMMIT"
          cp LICENSE NOTICE "dist/${package}/"
          cat > "dist/${package}/INSTALL.txt" <<'EOF'
          Apple Silicon macOS build. Locally signed; not Apple-notarized.
          Includes CLI and Code Mode Host; optional voice runtime is not bundled.

          Keep the bin directory together. Run bin/codexg, or install this
          directory under ~/.local/opt and symlink its bin/codexg into ~/.local/bin.
          Do not replace your existing codex executable.
          Settings, authentication and history use the normal ~/.codex directory.
          EOF
          tar -czf "dist/${package}.tar.gz" -C dist "$package"
          (cd dist && shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256")
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexg-aarch64-apple-darwin
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
