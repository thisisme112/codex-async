name: Async fork upstream sync

on:
  push:
    branches: [async-main, 'integration/official-*', 'integration/async-*']
    paths:
      - 'codex-rs/**'
      - 'scripts/async_fork/**'
      - 'scripts/codex_package/**'
      - 'third_party/v8/**'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.github/workflows/async-upstream-sync.yml'
      - '.github/async-fork-resolutions.json'
      - '.github/actions/async-rust-cache/**'
      - 'justfile'
  schedule:
    - cron: '23 19 * * *' # 03:23 Asia/Shanghai
  workflow_dispatch:
    inputs:
      check_only:
        description: Only inspect/merge; skip expensive Rust validation and publication
        type: boolean
        default: false
      verify_only:
        description: Validate the selected branch after manual conflict resolution; do not publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: async-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ !inputs.verify_only && (github.event_name != 'push' || (github.ref == 'refs/heads/async-main' && contains(github.event.head_commit.message, '[sync-upstream]'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      base: ${{ steps.merge.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: async-main
          fetch-depth: 0
          persist-credentials: false
      - name: Test synchronization safeguards
        run: python3 -m unittest discover -s scripts/async_fork -p 'test_*.py' -v
      - name: Prepare an isolated upstream merge
        id: merge
        run: python3 scripts/async_fork/sync.py prepare --output "$RUNNER_TEMP/async-sync"
      - name: Keep the candidate for validation
        if: steps.merge.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: async-sync-candidate
          path: |
            ${{ runner.temp }}/async-sync/candidate.bundle
            ${{ runner.temp }}/async-sync/metadata.json
          retention-days: 3
      - name: Keep the synchronization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: async-sync-report
          path: |
            ${{ runner.temp }}/async-sync/report.md
            ${{ runner.temp }}/async-sync/metadata.json
          if-no-files-found: warn
          retention-days: 7

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && !inputs.check_only
    runs-on: ${{ matrix.suite == 'cli' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: [runtime, core, cli]
    env:
      ASYNC_BUILD_JOBS: '2'
      ASYNC_VALIDATION_SUITE: ${{ matrix.suite }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RAYON_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: async-sync-candidate
          path: ${{ runner.temp }}/async-sync
      - name: Select the exact candidate
        run: |
          git fetch "$RUNNER_TEMP/async-sync/candidate.bundle" refs/async-sync/candidate:refs/async-sync/candidate
          git checkout --detach refs/async-sync/candidate
          python3 scripts/async_fork/sync.py check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.suite == 'cli'
        with:
          python-version: '3.12'
      - name: Restore compatible compiled dependencies
        uses: ./.github/actions/async-rust-cache
        with:
          group: ${{ matrix.suite == 'cli' && 'ubuntu22-cli' || (matrix.suite == 'runtime' && 'ubuntu24-runtime' || 'ubuntu24-core') }}
      - name: Resolve the matching official release version
        if: matrix.suite == 'cli'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/async_fork/upstream_version.py resolve --file "$RUNNER_TEMP/async-official-version.json"
          echo "ASYNC_UPSTREAM_VERSION_FILE=$RUNNER_TEMP/async-official-version.json" >> "$GITHUB_ENV"
      - name: Prepare native build dependencies
        shell: bash
        timeout-minutes: 5
        run: |
          python3 scripts/async_fork/native_deps.py --prefix "$RUNNER_TEMP/async-native" --env-file "$RUNNER_TEMP/async-native.env" 2>&1 | tee "$RUNNER_TEMP/async-native-deps.log"
          cat "$RUNNER_TEMP/async-native.env" >> "$GITHUB_ENV"
      - name: Validate CLI and asynchronous behavior
        shell: bash
        run: |
          CORES=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
          nice -n 15 taskset -c "$CORES" bash scripts/async_fork/validate.sh 2>&1 | tee "$RUNNER_TEMP/async-validation.log"
      - name: Keep the already-built installable CLI package
        if: matrix.suite == 'cli'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: async-linux-release-package
          path: ${{ runner.temp }}/async-package/
          retention-days: 1
      - name: Keep validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: async-validation-${{ matrix.suite }}-log
          path: |
            ${{ runner.temp }}/async-native-deps.log
            ${{ runner.temp }}/async-validation.log
          retention-days: 7

  verify_manual_merge:
    if: (github.event_name == 'push' && github.ref != 'refs/heads/async-main') || (inputs.verify_only && !inputs.check_only)
    runs-on: ${{ matrix.suite == 'cli' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Fixture-only repairs can reuse successful runtime/core-unit/CLI runs.
        # Scheduled upstream candidates still validate all three suites above.
        suite: ${{ fromJSON(startsWith(github.ref, 'refs/heads/integration/async-') && '["async"]' || '["runtime","core","cli"]') }}
    permissions:
      contents: read
    env:
      ASYNC_BUILD_JOBS: '2'
      ASYNC_VALIDATION_SUITE: ${{ matrix.suite }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RAYON_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.suite == 'cli'
        with:
          python-version: '3.12'
      - name: Check synchronization safeguards and feature contract
        run: |
          python3 -m unittest discover -s scripts/async_fork -p 'test_*.py' -v
          python3 scripts/async_fork/sync.py check
      - name: Restore compatible compiled dependencies
        uses: ./.github/actions/async-rust-cache
        with:
          group: ${{ matrix.suite == 'cli' && 'ubuntu22-cli' || (matrix.suite == 'runtime' && 'ubuntu24-runtime' || 'ubuntu24-core') }}
      - name: Resolve the matching official release version
        if: matrix.suite == 'cli'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/async_fork/upstream_version.py resolve --file "$RUNNER_TEMP/async-official-version.json"
          echo "ASYNC_UPSTREAM_VERSION_FILE=$RUNNER_TEMP/async-official-version.json" >> "$GITHUB_ENV"
      - name: Prepare native build dependencies
        shell: bash
        timeout-minutes: 5
        run: |
          python3 scripts/async_fork/native_deps.py --prefix "$RUNNER_TEMP/async-native" --env-file "$RUNNER_TEMP/async-native.env" 2>&1 | tee "$RUNNER_TEMP/async-native-deps.log"
          cat "$RUNNER_TEMP/async-native.env" >> "$GITHUB_ENV"
      - name: Validate the selected commit conservatively
        shell: bash
        run: |
          set -o pipefail
          CORES=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
          nice -n 15 taskset -c "$CORES" bash scripts/async_fork/validate.sh 2>&1 | tee "$RUNNER_TEMP/async-validation.log"
      - name: Keep the already-built installable CLI package
        if: matrix.suite == 'cli'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: async-linux-release-package
          path: ${{ runner.temp }}/async-package/
          retention-days: 1
      - name: Keep validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: async-manual-validation-${{ matrix.suite }}-log
          path: |
            ${{ runner.temp }}/async-native-deps.log
            ${{ runner.temp }}/async-validation.log
          retention-days: 7

  validate_windows:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && !inputs.check_only
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: async-sync-candidate
          path: ${{ runner.temp }}/async-sync
      - name: Select and check the exact candidate
        shell: pwsh
        run: |
          git fetch "$env:RUNNER_TEMP/async-sync/candidate.bundle" refs/async-sync/candidate:refs/async-sync/candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach refs/async-sync/candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/async_fork/sync.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts/desktop -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/desktop/test-background-panel.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve verified V8 archive
        shell: pwsh
        run: |
          python -c "import os,sys;sys.path.insert(0,'scripts');from codex_package.targets import TARGET_SPECS;from codex_package.v8 import resolve_codex_v8_cargo_env;values=resolve_codex_v8_cargo_env(TARGET_SPECS['x86_64-pc-windows-msvc']);open(os.environ['GITHUB_ENV'],'a',encoding='utf-8').writelines(f'{k}={v}\n' for k,v in values.items())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test Windows backend
        working-directory: codex-rs
        shell: pwsh
        run: |
          cargo build --locked --profile dev-small -p codex-cli --bin codex -p codex-code-mode-host --bin codex-code-mode-host -p codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner -p codex-windows-sandbox-service --bin codex-windows-sandbox-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --profile dev-small -p codex-core --lib tools::code_mode::completion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/dev-small/codex.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record exact Windows build identity
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @('codex.exe', 'codex-code-mode-host.exe', 'codex-command-runner.exe', 'codex-windows-sandbox-setup.exe', 'codex-windows-sandbox-service.exe')
          $hashes = @{}
          foreach ($name in $files) { $hashes[$name] = (Get-FileHash "codex-rs/target/dev-small/$name" -Algorithm SHA256).Hash.ToLowerInvariant() }
          @{source_commit=$sha; target='x86_64-pc-windows-msvc'; profile='dev-small'; files=$hashes} | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'codex-rs/target/dev-small/WINDOWS_BUILD_INFO.json'
      - name: Keep Windows build for desktop candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: async-windows-candidate
          path: |
            codex-rs/target/dev-small/codex.exe
            codex-rs/target/dev-small/codex-code-mode-host.exe
            codex-rs/target/dev-small/codex-command-runner.exe
            codex-rs/target/dev-small/codex-windows-sandbox-setup.exe
            codex-rs/target/dev-small/codex-windows-sandbox-service.exe
            codex-rs/target/dev-small/WINDOWS_BUILD_INFO.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, validate, validate_windows]
    if: needs.validate.result == 'success' && needs.validate_windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only this final job has a write token. No candidate build code runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: async-sync-candidate
          path: ${{ runner.temp }}/async-sync
      - name: Advance the usable branch atomically without force
        run: python3 scripts/async_fork/sync.py promote --output "$RUNNER_TEMP/async-sync"
