name: Build codexg for Windows

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      TARGET: x86_64-pc-windows-msvc
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Build CLI and Windows helpers
        working-directory: codex-rs
        run: |
          set -euo pipefail
          export STABLE_GIT_COMMIT="$GITHUB_SHA"
          cargo build --locked --release --target "$TARGET" \
            --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy \
            --bin codex-windows-sandbox-setup --bin codex-windows-sandbox-service \
            --bin codex-command-runner
      - name: Package and verify
        run: |
          set -euo pipefail
          package="codexg-$TARGET"
          mkdir -p "dist/$package/bin"
          for binary in codex codex-code-mode-host codex-responses-api-proxy codex-windows-sandbox-setup codex-windows-sandbox-service codex-command-runner; do
            cp "codex-rs/target/$TARGET/release/$binary.exe" "dist/$package/bin/"
          done
          mv "dist/$package/bin/codex.exe" "dist/$package/bin/codexg.exe"
          "dist/$package/bin/codexg.exe" --version
          "dist/$package/bin/codex-code-mode-host.exe" --help
          printf '%s\n' "$GITHUB_SHA" > "dist/$package/COMMIT"
          cp LICENSE NOTICE "dist/$package/"
          cat > "dist/$package/INSTALL.txt" <<'EOF'
          Windows x64 build. Not publisher-signed.
          Extract to a dedicated codexg directory and keep all bin files together.
          Run bin/codexg.exe or add this dedicated bin directory to PATH.
          Do not overwrite the existing Codex installation or its helpers.
          Settings, authentication and history use the normal Codex home.
          Optional voice runtime is not bundled. Startup is checked in CI;
          verify sandbox and interactive command/Cell wake on your own machine.
          EOF
      - name: Archive
        shell: pwsh
        run: |
          $package = "codexg-$env:TARGET"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
          $hash = (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content "dist/$package.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexg-x86_64-pc-windows-msvc
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
