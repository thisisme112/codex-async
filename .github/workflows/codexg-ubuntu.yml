name: Build codexg for Ubuntu

on:
  workflow_dispatch:
  push:
    branches: [background-completion-wake]
    paths:
      - .github/workflows/codexg-ubuntu.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      TARGET: x86_64-unknown-linux-musl
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
      # musl-gcc must not produce a PIE with a runtime loader dependency.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static -C relocation-model=static -C link-arg=-static -C link-arg=-no-pie"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Use hermetic Cargo home
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cargo-home/bin"
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo-home" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.cargo-home/bin" >> "$GITHUB_PATH"
          : > "$GITHUB_WORKSPACE/.cargo-home/config.toml"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Install musl dependencies
        run: bash .github/scripts/install-musl-build-tools.sh
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl
      - name: Build and hash bundled bwrap
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" --bin bwrap
          binary="target/$TARGET/release/bwrap"
          strip --strip-debug --strip-unneeded "$binary"
          digest="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"
      - name: Build CLI and companion binaries
        working-directory: codex-rs
        run: |
          set -euo pipefail
          export STABLE_GIT_COMMIT="$GITHUB_SHA"
          cargo build --locked --release --target "$TARGET" \
            --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy
      - name: Package and verify on Ubuntu 22.04
        run: |
          set -euo pipefail
          package="codexg-$TARGET"
          mkdir -p "dist/$package/bin"
          for binary in codex codex-code-mode-host codex-responses-api-proxy bwrap; do
            path="dist/$package/bin/$binary"
            cp "codex-rs/target/$TARGET/release/$binary" "$path"
            if [[ "$binary" != bwrap ]]; then
              strip --strip-debug --strip-unneeded "$path"
            fi
            file "$path"
            if readelf -l "$path" | grep -q INTERP; then
              echo "Unexpected runtime loader dependency: $path" >&2
              exit 1
            fi
            if readelf -d "$path" | grep -q '(NEEDED)'; then
              echo "Unexpected shared-library dependency: $path" >&2
              exit 1
            fi
          done
          echo "$CODEX_BWRAP_SHA256  dist/$package/bin/bwrap" | sha256sum -c -
          ln -s codex "dist/$package/bin/codexg"
          "dist/$package/bin/codexg" --version
          "dist/$package/bin/codex-code-mode-host" --help
          "dist/$package/bin/bwrap" --version
          printf '%s\n' "$GITHUB_SHA" > "dist/$package/COMMIT"
          cp LICENSE NOTICE "dist/$package/"
          cat > "dist/$package/INSTALL.txt" <<'EOF'
          Linux x86_64 musl build, startup checked on Ubuntu 22.04.
          Includes CLI, Code Mode Host, responses proxy and bundled bwrap.
          Optional voice runtime is not bundled.
          Keep the bin directory together. Run bin/codexg, or install this
          directory under ~/.local/opt and symlink bin/codexg into ~/.local/bin.
          Settings, authentication and history use the normal ~/.codex directory.
          Full sandbox and Cell wake behavior must also be checked on the target machine.
          EOF
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexg-x86_64-unknown-linux-musl
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
